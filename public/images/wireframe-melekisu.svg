<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" width="100%" height="100%" style="background:#ffffff; font-family:sans-serif;">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #2b2b2b; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .bar { fill: #e5e7eb; stroke: #2b2b2b; stroke-width: 2; }
      .ph-bg { fill: #f3f4f6; stroke: #2b2b2b; stroke-width: 2; }
      .line { stroke: #2b2b2b; stroke-width: 2; stroke-linecap: round; }
      .line-thin { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .x-mark { stroke: #2b2b2b; stroke-width: 2; }
      .text-bar { fill: #9ca3af; rx: 3px; }
      .text-dark { fill: #4b5563; rx: 3px; }
      .pill { fill: #ffffff; stroke: #2b2b2b; stroke-width: 2; rx: 12px; }
      .pill-active { fill: #d1d5db; stroke: #2b2b2b; stroke-width: 2; rx: 12px; }
    </style>
  </defs>

  <!-- ==================== BROWSER WINDOW CHROME ==================== -->
  <rect x="20" y="20" width="1160" height="1080" rx="12" class="frame" />
  
  <!-- Browser Header Bar -->
  <path d="M 20 62 L 1180 62" class="line" />
  <!-- Traffic Light Circles -->
  <circle cx="46" cy="41" r="6" fill="#e5e7eb" stroke="#2b2b2b" stroke-width="2" />
  <circle cx="66" cy="41" r="6" fill="#e5e7eb" stroke="#2b2b2b" stroke-width="2" />
  <circle cx="86" cy="41" r="6" fill="#e5e7eb" stroke="#2b2b2b" stroke-width="2" />
  
  <!-- Back / Forward / Refresh Arrows -->
  <rect x="115" y="32" width="22" height="18" rx="4" class="bar" />
  <path d="M 128 36 L 122 41 L 128 46" fill="none" class="line" />
  <rect x="145" y="32" width="22" height="18" rx="4" class="bar" />
  <path d="M 152 36 L 158 41 L 152 46" fill="none" class="line" />
  <circle cx="185" cy="41" r="7" fill="none" stroke="#2b2b2b" stroke-width="2" />

  <!-- URL Address Bar -->
  <rect x="210" y="31" width="940" height="20" rx="10" class="bar" />
  <rect x="225" y="38" width="120" height="6" class="text-bar" />

  <!-- ==================== 1. GLOBAL NAVBAR ==================== -->
  <rect x="20" y="62" width="1160" height="56" fill="#ffffff" />
  <path d="M 20 118 L 1180 118" class="line" />

  <!-- Logo (Square with X + Text bar) -->
  <rect x="50" y="76" width="28" height="28" rx="6" class="ph-bg" />
  <line x1="50" y1="76" x2="78" y2="104" class="x-mark" />
  <line x1="78" y1="76" x2="50" y2="104" class="x-mark" />
  <rect x="86" y="83" width="70" height="14" class="text-dark" />

  <!-- Nav Menu Links (Pills/Tabs) -->
  <rect x="200" y="80" width="60" height="20" rx="10" class="pill-active" />
  <rect x="270" y="80" width="55" height="20" rx="10" class="pill" />
  <rect x="335" y="80" width="110" height="20" rx="10" class="pill" />

  <!-- Search Bar -->
  <rect x="740" y="76" width="240" height="28" rx="14" class="bar" />
  <circle cx="756" cy="90" r="5" fill="none" stroke="#2b2b2b" stroke-width="2" />
  <line x1="760" y1="94" x2="765" y2="99" class="line" />
  <rect x="775" y="87" width="90" height="6" class="text-bar" />

  <!-- User Profile Badge -->
  <circle cx="1015" cy="90" r="14" class="ph-bg" />
  <rect x="1038" y="83" width="85" height="14" rx="4" class="pill" />

  <!-- ==================== 2. CATEGORY PILLS BAR ==================== -->
  <rect x="20" y="118" width="1160" height="46" fill="#fafafa" />
  <path d="M 20 164 L 1180 164" class="line" />
  <rect x="50" y="130" width="65" height="22" rx="11" class="pill-active" />
  <rect x="125" y="130" width="125" height="22" rx="11" class="pill" />
  <rect x="260" y="130" width="115" height="22" rx="11" class="pill" />
  <rect x="385" y="130" width="135" height="22" rx="11" class="pill" />
  <rect x="530" y="130" width="120" height="22" rx="11" class="pill" />

  <!-- ==================== 3. HERO SPOTLIGHT SECTION (2 COLUMNS) ==================== -->
  
  <!-- LEFT COLUMN: Featured News Hero Banner -->
  <g id="hero-left">
    <rect x="50" y="185" width="650" height="360" rx="16" class="ph-bg" />
    <!-- Image Box with X placeholder -->
    <line x1="50" y1="185" x2="700" y2="545" class="x-mark" />
    <line x1="700" y1="185" x2="50" y2="545" class="x-mark" />

    <!-- Overlay Content Box -->
    <rect x="75" y="210" width="120" height="22" rx="11" class="pill-active" />
    <rect x="75" y="245" width="100" height="10" class="text-dark" />
    
    <!-- Headline Title Bars -->
    <rect x="75" y="265" width="500" height="20" class="text-dark" />
    <rect x="75" y="293" width="420" height="20" class="text-dark" />

    <!-- Excerpt Bars -->
    <rect x="75" y="325" width="520" height="10" class="text-bar" />
    <rect x="75" y="343" width="480" height="10" class="text-bar" />
    <rect x="75" y="361" width="340" height="10" class="text-bar" />

    <!-- Bottom Action & Source -->
    <line x1="75" y1="490" x2="675" y2="490" stroke="#4b5563" stroke-width="1.5" />
    <rect x="75" y="505" width="70" height="8" class="text-bar" />
    <rect x="75" y="519" width="110" height="12" class="text-dark" />
    
    <rect x="535" y="502" width="140" height="30" rx="8" class="pill" />
    <line x1="645" y1="517" x2="660" y2="517" class="line" />
    <path d="M 655 512 L 660 517 L 655 522" fill="none" class="line" />
  </g>

  <!-- RIGHT COLUMN: Interactive Citizen Voice Card (Tanggapan Warga) -->
  <g id="hero-right">
    <rect x="720" y="185" width="430" height="360" rx="16" class="frame" />
    
    <!-- Top Meta -->
    <rect x="740" y="205" width="90" height="18" rx="9" class="pill-active" />
    <rect x="1075" y="209" width="55" height="10" class="text-bar" />
    
    <!-- Title -->
    <rect x="740" y="235" width="360" height="14" class="text-dark" />
    <rect x="740" y="255" width="280" height="14" class="text-dark" />
    <rect x="740" y="277" width="380" height="8" class="text-bar" />

    <!-- Key Insights Box -->
    <rect x="740" y="295" width="390" height="52" rx="8" class="ph-bg" />
    <circle cx="755" cy="310" r="4" fill="#4b5563" />
    <rect x="766" y="306" width="130" height="8" class="text-dark" />
    <rect x="766" y="322" width="340" height="7" class="text-bar" />
    <rect x="766" y="333" width="290" height="7" class="text-bar" />

    <!-- Citizen Comment Section Container -->
    <rect x="740" y="358" width="390" height="128" rx="8" class="ph-bg" />
    <rect x="752" y="368" width="100" height="10" class="text-dark" />
    
    <!-- Comment Item 1 -->
    <rect x="752" y="386" width="366" height="38" rx="6" class="frame" />
    <rect x="762" y="393" width="65" height="9" class="text-dark" />
    <rect x="1035" y="392" width="72" height="12" rx="6" class="pill-active" />
    <rect x="762" y="408" width="280" height="8" class="text-bar" />

    <!-- Comment Item 2 (User's Pending) -->
    <rect x="752" y="432" width="366" height="38" rx="6" class="frame" />
    <rect x="762" y="439" width="85" height="9" class="text-dark" />
    <rect x="1005" y="438" width="102" height="12" rx="6" class="pill" />
    <rect x="762" y="454" width="220" height="8" class="text-bar" />

    <!-- Card Footer -->
    <line x1="740" y1="498" x2="1130" y2="498" class="line-thin" />
    <rect x="742" y="508" width="22" height="18" rx="4" class="bar" />
    <rect x="770" y="513" width="18" height="8" class="text-dark" />
    <rect x="802" y="508" width="22" height="18" rx="4" class="bar" />
    <rect x="830" y="513" width="24" height="8" class="text-dark" />
    
    <rect x="1020" y="504" width="110" height="28" rx="8" class="pill-active" />
  </g>

  <!-- ==================== 4. SECTION HEADING ==================== -->
  <rect x="50" y="575" width="8" height="24" rx="4" fill="#2b2b2b" />
  <rect x="68" y="578" width="220" height="18" class="text-dark" />
  <rect x="1030" y="582" width="120" height="10" class="text-bar" />

  <!-- ==================== 5. 3-COLUMN NEWS GRID ==================== -->

  <!-- CARD 1 -->
  <g id="card-1">
    <rect x="50" y="615" width="345" height="350" rx="14" class="frame" />
    <!-- Image Box with X -->
    <rect x="50" y="615" width="345" height="160" rx="14" class="ph-bg" />
    <line x1="50" y1="615" x2="395" y2="775" class="x-mark" />
    <line x1="395" y1="615" x2="50" y2="775" class="x-mark" />
    <rect x="65" y="630" width="90" height="18" rx="9" class="pill-active" />
    
    <!-- Content -->
    <rect x="68" y="790" width="80" height="8" class="text-bar" />
    <rect x="68" y="806" width="290" height="14" class="text-dark" />
    <rect x="68" y="826" width="210" height="14" class="text-dark" />
    <rect x="68" y="848" width="300" height="8" class="text-bar" />
    <rect x="68" y="862" width="250" height="8" class="text-bar" />

    <!-- Card Footer -->
    <line x1="50" y1="915" x2="395" y2="915" class="line-thin" />
    <rect x="68" y="930" width="60" height="10" class="text-bar" />
    <rect x="290" y="924" width="88" height="22" rx="6" class="pill" />
  </g>

  <!-- CARD 2 -->
  <g id="card-2">
    <rect x="427" y="615" width="345" height="350" rx="14" class="frame" />
    <!-- Image Box with X -->
    <rect x="427" y="615" width="345" height="160" rx="14" class="ph-bg" />
    <line x1="427" y1="615" x2="772" y2="775" class="x-mark" />
    <line x1="772" y1="615" x2="427" y2="775" class="x-mark" />
    <rect x="442" y="630" width="105" height="18" rx="9" class="pill-active" />
    
    <!-- Content -->
    <rect x="445" y="790" width="75" height="8" class="text-bar" />
    <rect x="445" y="806" width="300" height="14" class="text-dark" />
    <rect x="445" y="826" width="190" height="14" class="text-dark" />
    <rect x="445" y="848" width="305" height="8" class="text-bar" />
    <rect x="445" y="862" width="260" height="8" class="text-bar" />

    <!-- Card Footer -->
    <line x1="427" y1="915" x2="772" y2="915" class="line-thin" />
    <rect x="445" y="930" width="60" height="10" class="text-bar" />
    <rect x="667" y="924" width="88" height="22" rx="6" class="pill" />
  </g>

  <!-- CARD 3 -->
  <g id="card-3">
    <rect x="805" y="615" width="345" height="350" rx="14" class="frame" />
    <!-- Image Box with X -->
    <rect x="805" y="615" width="345" height="160" rx="14" class="ph-bg" />
    <line x1="805" y1="615" x2="1150" y2="775" class="x-mark" />
    <line x1="1150" y1="615" x2="805" y2="775" class="x-mark" />
    <rect x="820" y="630" width="95" height="18" rx="9" class="pill-active" />
    
    <!-- Content -->
    <rect x="823" y="790" width="85" height="8" class="text-bar" />
    <rect x="823" y="806" width="295" height="14" class="text-dark" />
    <rect x="823" y="826" width="220" height="14" class="text-dark" />
    <rect x="823" y="848" width="300" height="8" class="text-bar" />
    <rect x="823" y="862" width="240" height="8" class="text-bar" />

    <!-- Card Footer -->
    <line x1="805" y1="915" x2="1150" y2="915" class="line-thin" />
    <rect x="823" y="930" width="60" height="10" class="text-bar" />
    <rect x="1045" y="924" width="88" height="22" rx="6" class="pill" />
  </g>

  <!-- ==================== 6. FOOTER ==================== -->
  <rect x="20" y="995" width="1160" height="105" fill="#f9fafb" rx="12" />
  <path d="M 20 995 L 1180 995" class="line" />
  
  <rect x="50" y="1020" width="100" height="12" class="text-dark" />
  <rect x="50" y="1038" width="240" height="8" class="text-bar" />
  <rect x="50" y="1052" width="180" height="8" class="text-bar" />

  <rect x="450" y="1020" width="70" height="10" class="text-dark" />
  <rect x="450" y="1036" width="50" height="7" class="text-bar" />
  <rect x="450" y="1048" width="55" height="7" class="text-bar" />

  <rect x="680" y="1020" width="65" height="10" class="text-dark" />
  <rect x="680" y="1036" width="45" height="7" class="text-bar" />
  <rect x="680" y="1048" width="50" height="7" class="text-bar" />

  <rect x="910" y="1020" width="75" height="10" class="text-dark" />
  <rect x="910" y="1036" width="120" height="7" class="text-bar" />
  <rect x="910" y="1048" width="90" height="7" class="text-bar" />

</svg>